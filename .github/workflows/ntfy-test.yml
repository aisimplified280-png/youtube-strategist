name: Test Android ntfy notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send_test_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install notification dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Send test push to Android
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: "https://ntfy.sh"
          NTFY_TEST_NOTIFICATION: "1"
          STRATEGIST_APP_URL: "https://youtube-strategist-gvysp46objgfmgmdemckwe.streamlit.app/"
        run: python strategy_notifications.py
