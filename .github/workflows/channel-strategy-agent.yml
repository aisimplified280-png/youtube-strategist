name: AI Simplified Lab daily channel strategist

on:
  # Temporary timing adjustment for today's trigger verification:
  # Primary daily strategist at 10:15 Asia/Kolkata (04:45 UTC).
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Dispatch source for run auditing"
        type: choice
        required: false
        default: workflow_dispatch
        options:
          - workflow_dispatch
          - supabase_watchdog
      target_video_id:
        description: "Optional 11-character YouTube video ID for a focused review-only test"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ai-simplified-lab-channel-strategist
  cancel-in-progress: false

jobs:
  strategist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Record strategy worker start time
        id: strategy_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Run evidence-first daily channel strategist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_STRATEGIST_STATE_SECRET: ${{ secrets.YOUTUBE_STRATEGIST_STATE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.6-flash"
          GEMINI_GATEKEEPER_MODEL: "gemini-3-flash-preview"
          GEMINI_FALLBACK_MODELS: "gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3-flash-preview"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          STRATEGY_CADENCE: "daily"
          STRATEGY_TARGET_VIDEO_ID: ${{ inputs.target_video_id || '' }}
          STRATEGY_TRIGGER_SOURCE: ${{ inputs.trigger_source || (github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'schedule') }}
          STRATEGY_CATALOGUE_LIMIT: "all"
          LOG_LEVEL: "INFO"
        run: python channel_strategy_worker.py --cadence=daily

      - name: Send ntfy and Discord notifications
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_SERVER: "https://ntfy.sh"
          STRATEGY_RUN_STARTED_AT: ${{ steps.strategy_start.outputs.started_at }}
          STRATEGY_WORKFLOW_CONCLUSION: ${{ job.status }}
          STRATEGIST_APP_URL: "https://youtube-strategist-gvysp46objgfmgmdemckwe.streamlit.app/"
        run: python strategy_notifications.py
