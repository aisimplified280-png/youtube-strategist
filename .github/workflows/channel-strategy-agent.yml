name: AI Simplified Lab daily channel strategist

on:
  # Metadata snapshots run at 02:15 UTC. The daily strategist starts afterwards,
  # at 08:01 Asia/Kolkata (02:31 UTC), using the stable seven-day metadata cooldown.
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Dispatch source for run auditing"
        type: choice
        required: false
        default: workflow_dispatch
        options:
          - workflow_dispatch
          - supabase_watchdog

permissions:
  contents: read

concurrency:
  group: ai-simplified-lab-channel-strategist
  cancel-in-progress: false

jobs:
  strategist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run evidence-first daily channel strategist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_STRATEGIST_STATE_SECRET: ${{ secrets.YOUTUBE_STRATEGIST_STATE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.6-flash"
          GEMINI_FALLBACK_MODELS: "gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3-flash-preview"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          STRATEGY_CADENCE: "daily"
          STRATEGY_TRIGGER_SOURCE: ${{ inputs.trigger_source || (github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'schedule') }}
          STRATEGY_CATALOGUE_LIMIT: "all"
          LOG_LEVEL: "INFO"
        run: python channel_strategy_worker.py --cadence=daily
