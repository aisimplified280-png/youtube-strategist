name: Register Discord slash commands

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-command-registration
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install registration dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Register /approvals with Discord
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/register_discord_commands.py
